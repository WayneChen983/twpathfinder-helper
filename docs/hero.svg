<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ee"/><stop offset="1" stop-color="#efe5d6"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aeff3"/><stop offset="1" stop-color="#baf2d1"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8f5b"/><stop offset="1" stop-color="#1c6b3c"/>
    </linearGradient>
    <radialGradient id="sun" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9f6ee"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- 斜向光影 -->
  <g fill="#ffffff" opacity=".45">
    <polygon points="700,0 760,0 520,400 460,400"/>
    <polygon points="820,0 850,0 610,400 580,400"/>
    <polygon points="930,0 1010,0 770,400 690,400"/>
  </g>

  <!-- 地球弧面與經緯 -->
  <circle cx="930" cy="560" r="400" fill="url(#sun)"/>
  <g fill="none" stroke="#9ad9c8" stroke-width="1.5" opacity=".8">
    <circle cx="930" cy="560" r="400"/>
    <ellipse cx="930" cy="560" rx="400" ry="150"/>
    <ellipse cx="930" cy="560" rx="400" ry="290"/>
    <ellipse cx="930" cy="560" rx="140" ry="400"/>
    <ellipse cx="930" cy="560" rx="280" ry="400"/>
  </g>

  <!-- 水平層次 -->
  <path d="M0 330 C200 300 380 350 600 325 S1000 300 1200 330 V400 H0Z" fill="url(#mint)" opacity=".75"/>
  <path d="M0 360 C240 335 420 385 660 358 S1040 340 1200 365 V400 H0Z" fill="url(#deep)" opacity=".9"/>

  <!-- 航線：從一份計畫書出發，經過幾個落點 -->
  <path id="route" d="M150 250 C330 60 560 60 700 170 S960 250 1060 120" fill="none" stroke="#1c6b3c" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- 起點：計畫書 -->
  <g transform="translate(96 196) rotate(-8)">
    <rect x="6" y="8" width="84" height="108" rx="8" fill="#d9cbb6"/>
    <rect width="84" height="108" rx="8" fill="#ffffff" stroke="#26292b" stroke-width="2.5"/>
    <rect x="14" y="16" width="38" height="8" rx="4" fill="url(#mint)"/>
    <g stroke="#26292b" stroke-width="2.5" stroke-linecap="round">
      <line x1="14" y1="40" x2="70" y2="40"/><line x1="14" y1="54" x2="62" y2="54"/>
      <line x1="14" y1="68" x2="70" y2="68"/><line x1="14" y1="82" x2="46" y2="82"/>
    </g>
    <path d="M52 92 l8 8 l16 -18" fill="none" stroke="#1c6b3c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 落點 -->
  <g>
    <g transform="translate(430 96)"><circle r="16" fill="url(#mint)" stroke="#26292b" stroke-width="2.5"/><circle r="5" fill="#26292b"/></g>
    <g transform="translate(700 170)"><circle r="16" fill="#ffffff" stroke="#26292b" stroke-width="2.5"/><circle r="5" fill="#1c6b3c"/></g>
    <g transform="translate(905 214)"><circle r="16" fill="url(#mint)" stroke="#26292b" stroke-width="2.5"/><circle r="5" fill="#26292b"/></g>
  </g>

  <!-- 終點：旗 -->
  <g transform="translate(1060 120)">
    <line x1="0" y1="0" x2="0" y2="-74" stroke="#26292b" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 -74 h50 l-12 15 l12 15 h-50z" fill="url(#deep)" stroke="#26292b" stroke-width="2.5" stroke-linejoin="round"/>
    <circle r="7" fill="#26292b"/>
  </g>

  <!-- 星點 -->
  <g fill="#1c6b3c" opacity=".55">
    <circle cx="360" cy="150" r="3"/><circle cx="560" cy="250" r="3"/><circle cx="810" cy="80" r="3"/>
    <circle cx="1130" cy="230" r="3"/><circle cx="250" cy="300" r="3"/>
  </g>
  <!-- 標題文字：計畫名稱（文字，非官方標誌） -->
  <g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
    <text x="60" y="84" font-size="40" font-weight="700" fill="#1c6b3c" letter-spacing="2">青年百億</text>
    <text x="62" y="120" font-size="21" fill="#4f5a5e" letter-spacing="1">海外圓夢基金計畫</text>
  </g>
</svg>
